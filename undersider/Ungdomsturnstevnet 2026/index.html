<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ungdomsturnstevnet 2026 - ATIF</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/x-icon" href="/images/icon/favicon.ico?v=3">
    <link rel="icon" type="image/png" href="/images/icon/favicon-16.png?v=3">
    <link rel="shortcut icon" href="/images/icon/favicon.ico?v=3">
    <link rel="apple-touch-icon" href="/images/icon/favicon.png?v=3">
    <style>
      .poster-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        max-width: 56rem;
        margin: 0 auto;
      }
      .poster-row img {
        width: 100%;
        height: auto;
        object-fit: contain;
        border-radius: 0.5rem;
      }
      @media (min-width: 768px) {
        .poster-row {
          grid-template-columns: 1fr 1fr;
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body style="background-color: #ecf2ff">
    <div id="navbar">
    </div>
    
    <div class="min-h-screen">
      <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
          <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
            Ungdomsturnstevnet 2026
          </h1>
          <div class="poster-row">
            <img src="/images/stevne26/hoved.jpg" alt="Ungdomsturnstevnet 2026 plakat">
            <img src="/images/stevne26/infoskriv.png" alt="Informasjon om Ungdomsturnstevnet 2026">
          </div>
        </div>
      </div>
    </div>
    
    <div id="footer">
    </div>
    
    <script src="/script.js"></script>
  </body>
</html>
